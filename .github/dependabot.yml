version: 2

# Dependency update automation.
#
# Only the root Cargo workspace and GitHub Actions are enabled here. Additional
# Cargo manifests exist and can be added as further `package-ecosystem: cargo`
# entries with the appropriate `directory` when we want them watched:
#   - /crates/garmr-webui   (its own nested manifest)
#   - /flightbeat
#   - /xtask
#   - /vendor/skade, /vendor/znippy, /vendor/facett, /vendor/znippy-zoomies
#     (vendored subtrees — update via `git subtree pull` upstream, not Dependabot,
#      so they are intentionally left out).

updates:
  # Rust crates — the root workspace lockfile.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "area:core"
    commit-message:
      prefix: "deps"
    groups:
      # The arrow crates are one ABI: arrow-array's types are arrow-buffer's,
      # and arrow-flight is built on both. Bumped in separate PRs each one is a
      # half-migration that does not compile — 58.3.0 -> 59.1.0 arrived as three
      # PRs and every one of them failed clippy and test. Group them so the
      # version moves as a unit and reviews as one change.
      arrow:
        patterns:
          - "arrow"
          - "arrow-*"
      # datafusion tracks a specific arrow major and breaks when arrow moves
      # under it, so it belongs in the same wave rather than its own PR.
      datafusion:
        patterns:
          - "datafusion"
          - "datafusion-*"
      # candle-core, candle-nn and candle-transformers are one release train:
      # nn and transformers are built directly on core's Tensor/Device types, so
      # a lone core bump is a half-migration that cannot compile. Dependabot has
      # 0.9.2 -> 0.11.0 open as a core-only PR right now for exactly this reason.
      candle:
        patterns:
          - "candle-*"
      # rsigma-parser, -ir and -eval are one project released in lockstep; the
      # eval crate consumes the parser's IR types, so they have to move together.
      rsigma:
        patterns:
          - "rsigma-*"
      # tonic is generated on top of prost (and tonic-prost bridges them), so a
      # prost major without the matching tonic is a broken build.
      prost-tonic:
        patterns:
          - "prost"
          - "prost-*"
          - "tonic"
          - "tonic-*"

  # GitHub Actions used by workflows under .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      # codeql-action/init, /analyze and /autobuild MUST run the same version —
      # mixing them makes `analyze` fail outright. Dependabot opened 4.37.4 ->
      # 4.37.6 as three separate PRs and each one broke `analyze (rust)` on its
      # own. Group them so the trio moves together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
