version = 1

# Garmr — REUSE bulk licensing. Per-file SPDX headers are authoritative where
# present; this file covers the rest (vendored third-party, config, generated,
# and asset files). Garmr's own source carries per-file AGPL-3.0-only headers.

[[annotations]]
path = ["Cargo.lock", "**/Cargo.toml", "rust-toolchain.toml", ".gitignore", ".gitattributes", "deny.toml", ".gitleaks.toml", "**/*.example.toml", "garmr.example.toml", "catalog.example.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vetra Automation AB"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["correlations/**", "hunts/**", "rules/**", "policies/**", "fixtures/**", "deploy/**", "packaging/**", "scripts/**", "supply-chain/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vetra Automation AB"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "vendor/skade/**"
precedence = "override"
SPDX-FileCopyrightText = "The skade authors (codeberg.org/nordisk/skade)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["vendor/znippy/**", "vendor/znippy-zoomies/**"]
precedence = "override"
SPDX-FileCopyrightText = "Rickard Lundin and the znippy contributors (codeberg.org/nordisk)"
SPDX-License-Identifier = "MIT"

# Garmr's own repo meta, CI, config, and web assets → AGPL like the source.
[[annotations]]
path = [".github/**", ".cargo/**", "CLAUDE.md", "**/*.html", "**/Cargo.lock", "**/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vetra Automation AB"
SPDX-License-Identifier = "AGPL-3.0-only"

# Documentation → CC-BY-4.0.
[[annotations]]
path = ["docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vetra Automation AB"
SPDX-License-Identifier = "CC-BY-4.0"

# Root metadata / projection tooling config.
[[annotations]]
path = ["NOTICE", "public-export.allowlist", "public-export.denylist", "public-export.keeplist", "**/webdriver.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vetra Automation AB"
SPDX-License-Identifier = "AGPL-3.0-only"
