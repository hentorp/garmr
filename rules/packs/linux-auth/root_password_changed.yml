title: Password changed for root
id: garmr-auth-root-passwd
status: stable
description: >
    The root password was changed. Legitimate during break-glass rotation -
    and exactly what an intruder does to lock operators out.
author: garmr
logsource:
    product: linux
detection:
    selection:
        service: passwd
        message|contains|all:
            - 'password changed'
            - 'root'
    condition: selection
falsepositives:
    - Scheduled credential rotation.
level: high
tags:
    - attack.impact
    - attack.t1531
