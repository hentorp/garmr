title: Broad privilege grant
id: garmr-pg-grant-all
status: stable
description: >
    GRANT ALL - handing every privilege on an object to a role. Almost always
    lazier than intended, sometimes hostile.
author: garmr
logsource:
    product: linux
    service: postgres
detection:
    audit:
        service: postgres
        message|contains: 'AUDIT:'
    stmt:
        message|contains: 'GRANT ALL'
    condition: audit and stmt
falsepositives:
    - Dev databases; throwaway environments.
level: high
tags:
    - attack.privilege_escalation
    - attack.t1078
