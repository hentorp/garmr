title: Server configuration changed via SQL
id: garmr-pg-alter-system
status: stable
description: >
    ALTER SYSTEM rewrites postgresql.auto.conf from SQL - changing logging,
    authentication or extension settings without touching the filesystem.
author: garmr
logsource:
    product: linux
    service: postgres
detection:
    audit:
        service: postgres
        message|contains: 'AUDIT:'
    stmt:
        message|contains: 'ALTER SYSTEM'
    condition: audit and stmt
falsepositives:
    - DBAs tuning via SQL (should be change-managed).
level: high
tags:
    - attack.defense_evasion
    - attack.t1562
