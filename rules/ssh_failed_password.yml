title: SSH failed password
id: garmr-ssh-failed-password
status: experimental
description: >
    An SSH authentication failure (wrong password). A single event is low
    signal; garmr collapses a burst by (rule, host, src_ip) into one case, so a
    brute-force attempt surfaces as one investigation with an event count.
author: garmr
logsource:
    product: linux
    service: sshd
detection:
    selection:
        service: sshd
        message|contains:
            - 'Failed password'
            - 'authentication failure'
    condition: selection
falsepositives:
    - A user mistyping their password once or twice.
level: medium
tags:
    - attack.credential_access
    - attack.t1110
