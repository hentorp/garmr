[package]
publish = false            # workspace-internal; the deployable is the `garmr` binary, not crates.io libs
name = "garmr-ingest"
description = "garmr ingest: native canonical HTTP event ingestion and syslog, normalised to garmr events. Loki push is an opt-in compatibility feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
garmr-core.workspace = true
garmr-enrich.workspace = true
garmr-store.workspace = true
garmr-sql.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
regex.workspace = true
syslog_loose.workspace = true

# Vendored znippy-zoomies (vendor/znippy-zoomies) for its multi-core NDJSON
# scanner: `json::scan_records_map_parallel_balanced` splits NDJSON safely on
# newlines and runs the per-record parse across all cores. Path dep — the crate
# is its own excluded workspace, same wiring skade/facett-core use.
znippy-zoomies = { path = "../../vendor/znippy-zoomies", version = "0.1" }

# Loki push compatibility only. Optional so the default build carries no Loki
# protocol code, no protobuf, and no snappy — Loki is not a dependency of garmr
# unless the `loki-compat` feature is explicitly enabled.
prost = { version = "0.14", optional = true }
snap = { version = "1", optional = true }
bytes = { version = "1", optional = true }

# Arrow-Flight columnar ingest (opt-in `flight` feature). A tonic gRPC
# FlightService whose `do_put` decodes the Arrow-IPC stream to RecordBatches and
# swallows them straight into the store via `append_batch` (no JSON parse, no
# owned Event). arrow-flight 58 resolves to the SAME crates.io arrow-array 58 skade
# is built against, so the decoded batch is exactly the type `append_batch` wants.
tonic = { version = "0.14", optional = true }
arrow-flight = { version = "58", optional = true }
arrow-array = { version = "58", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
# Opt-in Loki push receiver (`/loki/api/v1/push`, protobuf+snappy or JSON) for
# environments still fanning in through Grafana Alloy's `loki.write`. Off by
# default; native `/ingest/v1/events` is the vendor-neutral, go-forward path.
loki-compat = ["dep:prost", "dep:snap", "dep:bytes"]
# Arrow-Flight columnar ingest receiver (tonic FlightService `do_put`). Off by
# default so the base build carries no tonic/gRPC/arrow-flight.
flight = ["dep:tonic", "dep:arrow-flight", "dep:arrow-array", "dep:futures"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The live Flight e2e test (tests/flight_e2e.rs) opens a real store in a tempdir
# and serves the receiver on an ephemeral port.
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
