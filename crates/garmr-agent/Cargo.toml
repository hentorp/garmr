[package]
publish = false            # workspace-internal; the deployable is the `garmr` binary, not crates.io libs
name = "garmr-agent"
description = "garmr agent: the read-only triage loop, its tools, budget guardrails, verdicts, and Matrix escalation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
garmr-core.workspace = true
garmr-store.workspace = true
garmr-query = { workspace = true, features = ["store"] }
garmr-route.workspace = true
garmr-detect.workspace = true
garmr-correlate.workspace = true
garmr-llm.workspace = true
garmr-enrich.workspace = true
garmr-graph = { workspace = true, features = ["store"] }
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
skade.workspace = true
uuid.workspace = true
toml.workspace = true
blake3.workspace = true
async-trait.workspace = true
lettre.workspace = true
rmcp.workspace = true

[dev-dependencies]
async-trait.workspace = true
