[package]
publish = false
name = "garmr-monitor"
description = "User monitoring & watchlists (Phase 6): versioned, attributable monitoring profiles that watch a user, role, group, application, or sensitive resource, and a registry that resolves the strongest applicable non-expired profile for an access. Monitoring only RAISES attention (a sensitivity multiplier that is never below 1.0) and NEVER declares guilt. Every state change is an audited, version-bumping MonitoringChange. Pure, no I/O."
