name = "garmr-catalog"
description = "Application & resource CATALOG (Phase 4): the governed inventory of applications, data sources, objects and expected identities that the policy engine and detectors resolve against. Every fact carries an approval lifecycle (Candidate → Trusted → Retired) so a Candidate is NEVER treated as Trusted for a security decision. Pure, no I/O (except an optional TOML import helper)."
