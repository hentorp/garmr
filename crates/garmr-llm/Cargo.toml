[package]
publish = false            # workspace-internal; the deployable is the `garmr` binary, not crates.io libs
name = "garmr-llm"
description = "garmr LLM layer: one provider trait over the Anthropic Messages API and any OpenAI-compatible endpoint (Ollama, llama.cpp)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
garmr-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio.workspace = true            # tokio::time::sleep for the retry backoff
