[package]
publish = false            # workspace-internal; the deployable is the `garmr` binary, not crates.io libs
name = "garmr-enrich"
description = "garmr IP enrichment: RFC1918 classification, offline GeoIP (MaxMind/DB-IP mmdb), and IOC-list membership."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
garmr-core.workspace = true
maxminddb.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The 3rd Ragnar variant (RangeStree32) for firehose-scale IPv4 IOC/CIDR batch
# membership. Same vendored copy garm already builds via skade.
znippy-zoomies = { path = "../../vendor/znippy-zoomies" }
