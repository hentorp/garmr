[package]
name = "garmr-graph"
description = "garmr's entity graph for pivot / link-analysis (M5) — the domain layer (typed nodes, provenance, risk ranking) over the shared nornir-graph seam."
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
# The `store` feature adds the async builder (Graph::build) that pulls cases +
# event-co-occurrence edges from the store. The pure core (from_cases /
# add_event_edges / pivot) needs none of it, so unit tests stay lean.
store = ["dep:garmr-store", "dep:skade", "dep:tokio", "dep:tracing", "dep:chrono", "dep:gatling"]

# The `cozo` feature adds an OPTIONAL CozoDB-backed entity graph (`cozo_graph`)
# that mirrors the in-memory `Graph` traversal (pivot / shortest_path) via
# embedded Datalog. It is OFF by default: the default build keeps the pure-Rust
# in-memory `Graph` and never pulls cozo.
#
# The CozoDB IMPLEMENTATION no longer lives here — it moved to the shared
# `nornir-graph` seam (vendored below), which owns every graph-database backend
# and is generic over the node payload and the edge label so garmr instantiates
# it with its own `Node` / `EdgeKind`. This crate no longer names the `cozo`
# crate anywhere; it just turns the seam's backend on.
#
# ⚠ Enabling this pulls RAYON, which ROOT LAW #0 forbids. That is cozo's doing,
# not a choice: cozo 0.7.6 declares `rayon` optional (only its `graph-algo`
# feature enables it) but uses `rayon::spawn` and `par_iter` unconditionally in
# its own source, so it does not compile without it. This is unchanged by the
# refactor — the dependency line that used to live here took `graph-algo` too.
# OFF by default, so no ordinary garmr build gains rayon.
cozo = ["nornir-graph/cozo"]

[dependencies]
garmr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# The shared graph seam: the `GraphQuery` / `GraphStore` traits, the in-memory
# `MemGraph` this crate's `Graph` is built on, and the CozoDB backend. Vendored
# from edda under `vendor/edda`, following the same convention as skade, znippy,
# znippy-zoomies and facett — garmr consumes house crates by VENDORING, never as
# a live sibling across the company boundary.
#
# Its DEFAULT build is a true leaf (std only, zero dependencies), so taking the
# traits costs garmr nothing and the backends are all behind its own
# off-by-default features. That is why this is a plain dependency rather than a
# feature-gated one.
nornir-graph = { path = "../../vendor/edda/nornir-graph", version = "0.1" }
garmr-store = { workspace = true, optional = true }
skade = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# Published to crates.io as `rotaryengine`; lib name stays `gatling`. Fans the
# per-row event-edge triple extraction across cores (ROOT LAW #0: no rayon). Only
# needed by the store-backed builder, so it rides the `store` feature.
gatling = { path = "../../vendor/znippy-zoomies/gatling", package = "rotaryengine", version = "0.1", optional = true }

[dev-dependencies]
chrono.workspace = true
