# Okta System Log → OCSF → garmr. See cloudtrail-to-ocsf.toml for the strategy;
# `fixtures/ocsf/okta-mfa-denied.json` is this transform's output, and a test in
# garmr-ingest asserts what it becomes.
#
# Polls the System Log API. Entra ID differs only in the source and the field
# names — the OCSF shape below is identical, which is the whole point.

[sources.okta]
type = "http_client"
endpoint = "https://${OKTA_DOMAIN}/api/v1/logs"
scrape_interval_secs = 60
decoding.codec = "json"
headers.Authorization = "SSWS ${OKTA_API_TOKEN}"

[transforms.ocsf]
type = "remap"
inputs = ["okta"]
source = '''
.class_uid = 3002
.class_name = "Authentication"
.category_name = "Identity & Access Management"
.activity_name = "Logon"
.time = string!(.published)
.status = if .outcome.result == "SUCCESS" { "Success" } else { "Failure" }
# A denied MFA push is the signal an account-takeover attempt leaves behind, so
# it must not arrive as informational.
.severity = if .status == "Failure" { "High" } else { "Informational" }

.metadata.product.name = "Okta"
.metadata.product.vendor_name = "Okta"
.metadata.version = "1.3.0"

.actor.user.name = to_string(.actor.alternateId) ?? to_string(.actor.displayName) ?? "unknown"
.actor.user.uid = to_string(.actor.id) ?? ""
.src_endpoint.ip = to_string(.client.ipAddress) ?? ""
.src_endpoint.hostname = to_string(.client.device) ?? "unknown"

.message = join!([string!(.eventType), string!(.outcome.result), "for",
                  .actor.user.name, "—", to_string(.outcome.reason) ?? ""], " ")

.unmapped.eventType = to_string(.eventType) ?? ""
.unmapped.outcome_reason = to_string(.outcome.reason) ?? ""

del(.published); del(.outcome); del(.client); del(.eventType); del(.legacyEventType)
'''

[sinks.garmr]
type = "loki"
inputs = ["ocsf"]
endpoint = "${GARMR_LOKI_URL}"
encoding.codec = "json"
# `source = "ocsf"` is what routes this stream through the OCSF adapter on the
# LIVE path (garmr-ingest/src/loki.rs). Without it the documents are stored as
# raw lines and the actor/address fields never reach detection.
labels.source = "ocsf"
# The collector token — garmr stamps it on every event, and a non-loopback
# ingest bind refuses unauthenticated collectors.
auth.strategy = "bearer"
auth.token = "${GARMR_COLLECTOR_TOKEN}"
