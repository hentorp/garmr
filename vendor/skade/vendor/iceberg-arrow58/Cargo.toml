# iceberg-arrow58 — Apache Iceberg Rust (iceberg-rust 0.9.1) with its
# arrow-*/parquet deps bumped 57 → 58. ZERO source changes vs upstream
# iceberg 0.9.1; the only delta is the arrow/parquet major.
#
# WHY this is a vendored, separately-PUBLISHED crate rather than a
# `[patch.crates-io]` path-fork:
#   crates.io strips `[patch]` on publish, so any crate that got `iceberg`
#   from a local path-fork would, once published, resolve its arrow-58
#   source against stock iceberg 0.9.1 (arrow-57) and fail to compile.
#   Publishing the fork under a unique name (`iceberg-arrow58`) with the
#   library still named `iceberg` lets consumers write
#   `iceberg = { package = "iceberg-arrow58", version = "0.9.1" }` and keep
#   `use iceberg::…` unchanged, with NO patch block to be stripped.
#
# skade is the SINGLE canonical publisher of this crate (the global crates.io
# name is owned here); znippy + nornir depend on it from crates.io / by path.
# Drop this crate the moment upstream iceberg-rust ships an arrow-58 release —
# then it's a plain `iceberg = "X"` version bump everywhere.
[package]
name = "iceberg-arrow58"
version = "0.9.7"
edition = "2024"
rust-version = "1.92"
description = "Apache Iceberg Rust (iceberg-rust 0.9.1) with arrow-*/parquet bumped 57→58. Drop-in `iceberg` library (lib name unchanged); a stopgap until upstream ships an arrow-58 release."
homepage = "https://rust.iceberg.apache.org/"
repository = "https://codeberg.org/nordisk/skade"
readme = "README.md"
keywords = ["iceberg", "arrow", "parquet"]
categories = ["database"]
license = "Apache-2.0"
# Keep the published tarball lean: bench/test fixtures stay out.
exclude = ["testdata/", "DEPENDENCIES.rust.tsv", "Cargo.toml.orig", ".nornir/", ".cargo_vcs_info.json"]

[package.metadata.cargo-machete]
ignored = ["tap"]

[features]
default = []

# The library is still named `iceberg`, so downstreams `use iceberg::…`
# unchanged — only the *package* name differs.
[lib]
name = "iceberg"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.72"
apache-avro = { version = "0.21", features = ["zstandard"] }
array-init = "2"
arrow-arith = "58"
arrow-array = "58"
arrow-buffer = "58"
arrow-cast = "58"
arrow-ord = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-string = "58"
as-any = "0.3.2"
async-trait = "0.1.89"
backon = "1.5.1"
base64 = "0.22.1"
bimap = "0.6"
bytes = "1.11"
chrono = "0.4.41"
derive_builder = "0.20"
expect-test = "1"
fastnum = { version = "0.7", features = ["std", "serde"], default-features = false }
flate2 = "1.1.5"
fnv = "1.0.7"
futures = "0.3"
itertools = "0.13"
moka = { version = "0.12.10", features = ["future"] }
murmur3 = "0.5.2"
once_cell = "1.20"
ordered-float = "4"
parquet = { version = "58", features = ["async"] }
rand = "0.9.3"
reqwest = { version = "0.12.12", features = ["json"], default-features = false }
roaring = "0.11"
serde = { version = "1.0.219", features = ["rc"] }
serde_bytes = "0.11.17"
serde_derive = "1.0.219"
serde_json = "1.0.142"
serde_repr = "0.1.16"
serde_with = "3.4"
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.47", features = ["sync"], default-features = false }
typed-builder = "0.20"
typetag = "0.2"
url = "2.5.7"
uuid = { version = "1.18", features = ["v7"] }
zstd = "0.13.3"

[dev-dependencies]
expect-test = "1"
minijinja = "2.12.0"
mockall = "0.13.1"
pretty_assertions = "1.4"
rand = "0.9.3"
regex = "1.11.3"
serde_arrow = { version = "0.14", features = ["arrow-58"] }
tempfile = "3.18"
